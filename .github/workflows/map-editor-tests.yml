name: Map editor tests
on:
  pull_request:
    paths:
      - '**/*.js'
      - 'package.json'
      - '.github/workflows/map-editor-tests.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - 'package.json'
      - '.github/workflows/map-editor-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ui-shell.js
          node --check map-hole-geometry.js
      - name: Run regression tests
        run: npm test
